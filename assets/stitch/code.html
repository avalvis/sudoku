        this.isMuted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playTap() {
        if (this.isMuted || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      }
      playPencil() {
        if (this.isMuted || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(820, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(1150, this.ctx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.03);
      }
      playSuccess() {
        if (this.isMuted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc1.frequency.setValueAtTime(523.25, now); // C5
        osc2.frequency.setValueAtTime(659.25, now + 0.06); // E5
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(this.ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.2);
        osc2.start(now + 0.06);
        osc2.stop(now + 0.35);
      }
      playAlert() {
        if (this.isMuted || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }
    }
    const sound = new SoundEngine();

    // --- 2. Board Model Data (Authentic Solvable Editorial Layout) ---
    // 0 represents empty. 'given' indicates original newspaper print.
    const initialBoard = [
      // Block 1,2,3
      [5, 3, 0,  0, 7, 0,  0, 0, 0],
      [6, 0, 0,  1, 9, 5,  0, 0, 0],
      [0, 9, 8,  0, 0, 0,  0, 6, 0],
      // Block 4,5,6
      [8, 0, 0,  0, 6, 0,  0, 0, 3],
      [4, 0, 0,  8, 0, 3,  0, 0, 1],
      [7, 0, 0,  0, 2, 0,  0, 0, 6],
      // Block 7,8,9
      [0, 6, 0,  0, 0, 0,  2, 8, 0],
      [0, 0, 0,  4, 1, 9,  0, 0, 5],
      [0, 0, 0,  0, 8, 0,  0, 7, 9]
    ];

    // Current cell states
    let cellData = [];
    let selectedCell = { r: 3, c: 4 }; // Default focused cell (middle area)
    let notesMode = false;

    // Initialize state
    for (let r = 0; r < 9; r++) {
      cellData[r] = [];
      for (let c = 0; c < 9; c++) {
        const val = initialBoard[r][c];
        cellData[r][c] = {
          r, c,
          val: val,
          isGiven: val !== 0,
          notes: []
        };
      }
    }

    // Add some editorial candidate notes to empty cells for visual authenticity
    cellData[0][2].notes = [1, 2, 4];
    cellData[2][0].notes = [1, 2];
    cellData[3][1].notes = [1, 5];
    cellData[4][4].notes = [5]; // Center draft note
    cellData[6][2].notes = [3, 7];

    // User-entered value example (distinct blue ink Space Grotesk)
    cellData[0][6].val = 9;
    cellData[0][6].isGiven = false;

    // --- 3. Grid Renderer ---
    const gridContainer = document.getElementById('sudoku-grid');

    function renderGrid() {
      gridContainer.innerHTML = '';
      const currentSelectedVal = cellData[selectedCell.r][selectedCell.c].val;

      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const cell = cellData[r][c];
          const isSelected = (selectedCell.r === r && selectedCell.c === c);
          const isSameRowCol = (selectedCell.r === r || selectedCell.c === c);
          const isSameBlock = (
            Math.floor(selectedCell.r / 3) === Math.floor(r / 3) &&
            Math.floor(selectedCell.c / 3) === Math.floor(c / 3)
          );
          const isSameNumber = (currentSelectedVal > 0 && cell.val === currentSelectedVal);
          
          // Border styling for 3x3 quadrant separation
          let borderClasses = '';
          // Right border
          if (c % 3 === 2 && c !== 8) {
            borderClasses += ' border-r-[2.5px] border-r-ink-primary dark:border-r-dark-ink-primary';
          } else if (c !== 8) {
            borderClasses += ' border-r border-r-paper-stroke dark:border-r-dark-border';
          }
          // Bottom border
          if (r % 3 === 2 && r !== 8) {
            borderClasses += ' border-b-[2.5px] border-b-ink-primary dark:border-b-dark-ink-primary';
          } else if (r !== 8) {
            borderClasses += ' border-b border-b-paper-stroke dark:border-b-dark-border';
          }

          // Background fill logic based on elevation tokens
          let bgClass = 'bg-transparent';
          if (isSelected) {
            bgClass = 'bg-cell-focus dark:bg-dark-cell-focus ring-2 ring-primary-container dark:ring-primary-fixed-dim z-10';
          } else if (isSameNumber) {
            bgClass = 'bg-same-number/70 dark:bg-dark-same-number/60 font-bold';
          } else if (isSameRowCol || isSameBlock) {
            bgClass = 'bg-guide-highlight/50 dark:bg-white/[0.04]';
          }

          // Special highlight error cell demonstration
          let errorAlertClass = '';
          if (r === 1 && c === 1) { // Highlighted demo conflict
            // errorAlertClass = 'shake-cell bg-error-bg text-error-terracotta';
          }

          const cellEl = document.createElement('div');
          cellEl.className = `relative flex items-center justify-center cursor-pointer transition-all duration-75 select-none ${borderClasses} ${bgClass} ${errorAlertClass}`;
          cellEl.dataset.row = r;
          cellEl.dataset.col = c;

          // Render Cell Content: Value OR 3x3 Notes Matrix
          if (cell.val > 0) {
            const numSpan = document.createElement('span');
            if (cell.isGiven) {
              numSpan.className = 'font-grid-given text-grid-given text-ink-primary dark:text-dark-ink-primary';
            } else {
              // Player entered number in Space Grotesk deep cobalt ink
              numSpan.className = 'font-grid-input text-grid-input text-primary dark:text-primary-fixed-dim font-bold';
            }
            numSpan.innerText = cell.val;
            cellEl.appendChild(numSpan);
          } else if (cell.notes.length > 0) {
            // Pencil Notes Subgrid (3x3 micro matrix)
            const notesGrid = document.createElement('div');
            notesGrid.className = 'grid grid-cols-3 grid-rows-3 w-full h-full p-0.5 pointer-events-none';
            for (let n = 1; n <= 9; n++) {
              const noteSpan = document.createElement('span');
              noteSpan.className = 'font-grid-notes text-grid-notes flex items-center justify-center text-ink-muted leading-none';
              noteSpan.innerText = cell.notes.includes(n) ? n : '';
              notesGrid.appendChild(noteSpan);
            }
            cellEl.appendChild(notesGrid);
          }

          // Cell click handler
          cellEl.addEventListener('click', () => {
            sound.init();
            selectedCell = { r, c };
            sound.playTap();
            renderGrid();
          });

          gridContainer.appendChild(cellEl);
        }
      }
    }

    // --- 4. Number Input & Keypad Interactions ---
    function handleNumberInput(digit) {
      sound.init();
      const currentCell = cellData[selectedCell.r][selectedCell.c];
      
      // If cell is given pre-filled, cannot alter
      if (currentCell.isGiven) {
        sound.playAlert();
        return;
      }

      if (notesMode) {
        // Toggle note
        const index = currentCell.notes.indexOf(digit);
        if (index > -1) {
          currentCell.notes.splice(index, 1);
        } else {
          currentCell.notes.push(digit);
          currentCell.notes.sort((a, b) => a - b);
        }
        currentCell.val = 0; // Clear main value
        sound.playPencil();
      } else {
        // Direct value entry
        if (currentCell.val === digit) {
          currentCell.val = 0; // Toggle off if clicked again
        } else {
          currentCell.val = digit;
          currentCell.notes = []; // Clear notes upon placing value
          sound.playSuccess();
        }
      }
      renderGrid();
    }

    // Bind keypad buttons
    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const key = parseInt(btn.dataset.key);
        if (key && !btn.classList.contains('cursor-not-allowed')) {
          handleNumberInput(key);
        }
      });
    });

    // Erase Action
    document.getElementById('action-erase').addEventListener('click', () => {
      sound.init();
      const currentCell = cellData[selectedCell.r][selectedCell.c];
      if (!currentCell.isGiven && (currentCell.val > 0 || currentCell.notes.length > 0)) {
        currentCell.val = 0;
        currentCell.notes = [];
        sound.playTap();
        renderGrid();
      }
    });

    // Notes Mode Toggle Action
    const notesBtn = document.getElementById('action-notes');
    const notesBox = document.getElementById('notes-indicator-box');
    const notesPill = document.getElementById('notes-pill');

    notesBtn.addEventListener('click', () => {
      sound.init();
      notesMode = !notesMode;
      sound.playPencil();

      if (notesMode) {
        notesBox.classList.add('bg-secondary-fixed', 'border-secondary', 'text-secondary');
        notesPill.innerText = 'ON';
        notesPill.classList.remove('bg-surface-variant', 'text-ink-secondary');
        notesPill.classList.add('bg-secondary', 'text-white', 'border-secondary');
      } else {
        notesBox.classList.remove('bg-secondary-fixed', 'border-secondary', 'text-secondary');
        notesPill.innerText = 'OFF';
        notesPill.classList.remove('bg-secondary', 'text-white', 'border-secondary');
        notesPill.classList.add('bg-surface-variant', 'text-ink-secondary');
      }
    });

    // Undo Action simulation
    document.getElementById('action-undo').addEventListener('click', () => {
      sound.init();
      sound.playTap();
      // Simple feedback: clear selected if user placed
      const c = cellData[selectedCell.r][selectedCell.c];
      if (!c.isGiven && c.val > 0) {
        c.val = 0;
        renderGrid();
      }
    });

    // Hint Action
    document.getElementById('action-hint').addEventListener('click', () => {
      sound.init();
      sound.playSuccess();
      const c = cellData[selectedCell.r][selectedCell.c];
      if (!c.isGiven) {
        c.val = 7; // demo auto-hint fill
        c.notes = [];
        renderGrid();
      }
    });

    // --- 5. Sound FX Toggle ---
    const soundBtn = document.getElementById('sound-btn');
    const soundIcon = document.getElementById('sound-icon');
    soundBtn.addEventListener('click', () => {
      sound.init();
      sound.isMuted = !sound.isMuted;
      soundIcon.innerText = sound.isMuted ? 'volume_off' : 'volume_up';
      soundIcon.style.opacity = sound.isMuted ? '0.4' : '1';
    });

    // --- 6. Dark / Light Mode Switcher ---
    const themeBtn = document.getElementById('theme-btn');
    const themeIcon = document.getElementById('theme-icon');
    const htmlRoot = document.documentElement;

    themeBtn.addEventListener('click', () => {
      sound.init();
      sound.playTap();
      if (htmlRoot.classList.contains('dark')) {
        htmlRoot.classList.remove('dark');
        themeIcon.innerText = 'dark_mode';
      } else {
        htmlRoot.classList.add('dark');
        themeIcon.innerText = 'light_mode';
      }
      renderGrid();
    });

    // --- 7. Play / Pause & Elapsed Timer ---
    let timerSeconds = 268; // 04:28
    let isPaused = false;
    const timerEl = document.getElementById('game-timer');
    const pauseBtn = document.getElementById('pause-btn');
    const pauseIcon = document.getElementById('pause-icon');

    setInterval(() => {
      if (!isPaused) {
        timerSeconds++;
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        timerEl.innerText = `${mins}:${secs}`;
      }
    }, 1000);

    pauseBtn.addEventListener('click', () => {
      sound.init();
      sound.playTap();
      isPaused = !isPaused;
      pauseIcon.innerText = isPaused ? 'play_arrow' : 'pause';
      timerEl.style.opacity = isPaused ? '0.4' : '1';
    });

    // Initial render
    renderGrid();
  </script>
</body></html>
