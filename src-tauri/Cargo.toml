[package]
name = "sudoku"
version = "0.9.0"
description = "Offline Sudoku with Classic and Daily puzzles"
authors = ["Antonis Valvis"]
homepage = "https://www.avalvis.gr"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
