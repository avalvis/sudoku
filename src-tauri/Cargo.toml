[package]
name = "editorial-sudoku"
version = "0.3.0"
description = "A quiet place for a good puzzle"
authors = ["Editorial Sudoku"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
